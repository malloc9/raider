<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raider - Routine Manager</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #1a1a2e;
      color: #eaeaea;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #16213e;
      padding: 1rem 2rem;
      border-bottom: 1px solid #0f3460;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 600;
      color: #e94560;
    }

    .header-actions {
      display: flex;
      gap: 0.5rem;
    }

    main {
      flex: 1;
      padding: 2rem;
      display: flex;
      gap: 2rem;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    .panel {
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 8px;
      padding: 1.5rem;
    }

    .panel h2 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 1rem;
      color: #e94560;
    }

    /* Accounts panel */
    #accounts-panel {
      width: 280px;
      flex-shrink: 0;
    }

    .account-list {
      list-style: none;
    }

    .account-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
      margin-bottom: 0.5rem;
    }

    .account-item:hover {
      background: #0f3460;
    }

    .account-item.active {
      background: #0f3460;
      border: 1px solid #e94560;
    }

    .account-name {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .account-actions {
      display: flex;
      gap: 0.25rem;
    }

    .btn-icon {
      background: none;
      border: none;
      color: #888;
      cursor: pointer;
      padding: 0.25rem;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-icon:hover {
      background: #0f3460;
      color: #eaeaea;
    }

    .btn-icon.delete:hover {
      color: #e94560;
    }

    .btn-primary {
      background: #e94560;
      border: none;
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      width: 100%;
      margin-top: 1rem;
    }

    .btn-primary:hover {
      background: #d63a55;
    }

    .btn-secondary {
      background: #0f3460;
      border: 1px solid #1a1a2e;
      color: #eaeaea;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
    }

    .btn-secondary:hover {
      background: #1a1a2e;
    }

    .btn-danger {
      background: #e94560;
      border: none;
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
    }

    .btn-danger:hover {
      background: #d63a55;
    }

    /* Routine panel */
    #routine-panel {
      flex: 1;
      min-width: 0;
    }

    .routine-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .routine-account-name {
      font-size: 1.25rem;
      font-weight: 600;
    }

    .chore-list {
      list-style: none;
    }

    .chore-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem;
      background: #1a1a2e;
      border: 1px solid #0f3460;
      border-radius: 6px;
      margin-bottom: 0.75rem;
      transition: all 0.2s;
    }

    .chore-item.dragging {
      opacity: 0.5;
      border-color: #e94560;
    }

    .chore-item.disabled {
      opacity: 0.6;
    }

    .chore-item.disabled .chore-name {
      text-decoration: line-through;
      color: #888;
    }

    .drag-handle {
      color: #666;
      cursor: grab;
      padding: 0.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .drag-handle:active {
      cursor: grabbing;
      color: #e94560;
    }

    .chore-checkbox {
      width: 20px;
      height: 20px;
      accent-color: #e94560;
      cursor: pointer;
    }

    .chore-info {
      flex: 1;
      min-width: 0;
    }

    .chore-name {
      font-weight: 500;
      font-size: 1rem;
    }

    .chore-description {
      font-size: 0.85rem;
      color: #888;
      margin-top: 0.25rem;
    }

    .chore-order {
      color: #666;
      font-size: 0.85rem;
      width: 30px;
      text-align: right;
    }

    .run-chore-btn {
      background: #0f3460;
      border: 1px solid #1a1a2e;
      color: #eaeaea;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 28px;
    }

    .run-chore-btn:hover:not(:disabled) {
      background: #1a1a2e;
      color: #e94560;
    }

    .run-chore-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Run panel */
    #run-panel {
      width: 320px;
      flex-shrink: 0;
    }

    .run-status {
      padding: 1rem;
      background: #1a1a2e;
      border: 1px solid #0f3460;
      border-radius: 6px;
      margin-bottom: 1rem;
    }

    .run-status.idle {
      border-color: #0f3460;
    }

    .run-status.running {
      border-color: #e94560;
    }

    .run-status.complete {
      border-color: #4ade80;
    }

    .run-status.error {
      border-color: #f87171;
    }

    .status-label {
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 0.5rem;
    }

    .status-value {
      font-size: 1.25rem;
      font-weight: 600;
    }

    .run-results {
      list-style: none;
      max-height: 300px;
      overflow-y: auto;
    }

    .run-result-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem;
      background: #1a1a2e;
      border: 1px solid #0f3460;
      border-radius: 6px;
      margin-bottom: 0.5rem;
    }

    .result-icon {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
    }

    .result-icon.success {
      background: rgba(74, 222, 128, 0.2);
      color: #4ade80;
    }

    .result-icon.failure {
      background: rgba(248, 113, 113, 0.2);
      color: #f87171;
    }

    .result-info {
      flex: 1;
      min-width: 0;
    }

    .result-chore-name {
      font-weight: 500;
    }

    .result-message {
      font-size: 0.8rem;
      color: #888;
    }

    .result-time {
      font-size: 0.75rem;
      color: #666;
    }

    .btn-run {
      width: 100%;
      padding: 1rem;
      font-size: 1.1rem;
      font-weight: 600;
    }

    .btn-run:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Modals */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal-overlay.hidden {
      display: none;
    }

    .modal {
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 8px;
      padding: 1.5rem;
      width: 90%;
      max-width: 400px;
    }

    .modal h3 {
      margin-bottom: 1rem;
      color: #e94560;
    }

    .modal-input {
      width: 100%;
      padding: 0.75rem;
      background: #1a1a2e;
      border: 1px solid #0f3460;
      border-radius: 6px;
      color: #eaeaea;
      font-size: 1rem;
      margin-bottom: 1rem;
    }

    .modal-input:focus {
      outline: none;
      border-color: #e94560;
    }

    .modal-actions {
      display: flex;
      gap: 0.5rem;
      justify-content: flex-end;
    }

    .empty-state {
      text-align: center;
      padding: 3rem;
      color: #666;
    }

    .empty-state-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <header>
    <h1>Raider</h1>
    <div class="header-actions">
      <button id="new-account-btn" class="btn-primary">New Account</button>
    </div>
  </header>

  <main>
    <!-- Accounts Panel -->
    <aside id="accounts-panel" class="panel">
      <h2>Accounts</h2>
      <ul id="account-list" class="account-list"></ul>
      <button id="add-account-btn" class="btn-primary">Add Account</button>
    </aside>

    <!-- Routine Panel -->
    <section id="routine-panel" class="panel">
      <div class="routine-header">
        <div>
          <h2 id="routine-account-name" class="routine-account-name">Select an account</h2>
          <p id="routine-account-hint" style="color: #888; font-size: 0.85rem;">Choose an account from the left to manage its Routine</p>
        </div>
      </div>
      <ul id="chore-list" class="chore-list">
        <li class="empty-state">
          <div class="empty-state-icon">📋</div>
          <p>No account selected</p>
        </li>
      </ul>
    </section>

    <!-- Run Panel -->
    <aside id="run-panel" class="panel">
      <h2>Run</h2>
      <div id="run-status" class="run-status idle">
        <div class="status-label">Status</div>
        <div id="status-value" class="status-value">Idle</div>
      </div>
      <ul id="run-results" class="run-results"></ul>
      <button id="run-btn" class="btn-primary btn-run" disabled>Run Routine</button>
    </aside>
  </main>

  <!-- New Account Modal -->
  <div id="account-modal" class="modal-overlay hidden">
    <div class="modal">
      <h3 id="modal-title">New Account</h3>
      <input type="text" id="modal-input" class="modal-input" placeholder="Account name" />
      <div class="modal-actions">
        <button id="modal-cancel" class="btn-secondary">Cancel</button>
        <button id="modal-confirm" class="btn-primary">Create</button>
      </div>
    </div>
  </div>

  <!-- Rename Account Modal -->
  <div id="rename-modal" class="modal-overlay hidden">
    <div class="modal">
      <h3>Rename Account</h3>
      <input type="text" id="rename-input" class="modal-input" placeholder="New name" />
      <div class="modal-actions">
        <button id="rename-cancel" class="btn-secondary">Cancel</button>
        <button id="rename-confirm" class="btn-primary">Save</button>
      </div>
    </div>
  </div>

  <script src="./renderer.js"></script>
</body>
</html>
